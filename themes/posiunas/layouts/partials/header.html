{{- if not .IsHome }}
<header class="site-header">
    <a href="/" class="mini-profile">
        <span class="mini-avatar"><img src="/avatar.webp" alt="" width="64" height="64"></span>
        <span class="mini-name">{{ site.Params.title }}</span>
        <span class="mini-subtitle">{{ site.Params.subtitle }}</span>
    </a>
</header>
{{- end }}
